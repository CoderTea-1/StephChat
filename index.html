<!-- Define the document type as HTML5 -->
<!doctype html>
<!-- Set the root HTML element language to English -->
<html lang="en">
  <head>
    <!-- Set character encoding to UTF-8 for broad character support -->
    <meta charset="UTF-8" />
    <!-- Set the browser window/tab title -->
    <title>Aesthetic Stream Multi-Chat</title>
    <!-- Include Pusher JavaScript library for real-time Kick chat connection -->
    <script src="https://js.pusher.com/7.2/pusher.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- DOM container elements for background effects and user configuration controls -->
    <div id="butterfly-container"></div>
    <div id="burst-container"></div>
    <div id="config-bar">
      <!-- Input field for Twitch channel target -->
      <input
        type="text"
        id="twitch-channel"
        value="sassinatorsteph"
        placeholder="Twitch"
      />
      <!-- Input field for Kick channel target -->
      <input
        type="text"
        id="kick-channel"
        value="sassinatorsteph"
        placeholder="Kick"
      />
      <!-- Input field for YouTube handle target -->
      <input
        type="text"
        id="yt-handle"
        value="UC0kfnDtCC6CJ7Z33ax3M7Mg"
        placeholder="YouTube Channel ID"
      />

      <!-- Color picker controls for the user header info box background -->
      <div
        class="color-picker-wrapper"
        style="
          display: flex;
          gap: 10px;
          align-items: center;
          margin-bottom: 10px;
        "
      >
        <label for="userbox-color-picker">User Box:</label>
        <input
          type="color"
          id="userbox-color-picker"
          value="#af98dc"
          oninput="updateUserBoxColor()"
        />
        <input
          type="range"
          id="userbox-opacity-slider"
          min="0"
          max="1"
          step="0.01"
          value="0.9"
          oninput="updateUserBoxColor()"
        />
        <input
          type="text"
          id="userbox-color-input"
          readonly
          style="display: none"
        />
      </div>

      <!-- Color picker controls for the message content box background -->
      <div
        class="color-picker-wrapper"
        style="
          display: flex;
          gap: 10px;
          align-items: center;
          margin-bottom: 10px;
        "
      >
        <label for="msgbox-color-picker">Message Box:</label>
        <input
          type="color"
          id="msgbox-color-picker"
          value="#ff69b4"
          oninput="updateMsgBoxColor()"
        />
        <input
          type="range"
          id="msgbox-opacity-slider"
          min="0"
          max="1"
          step="0.01"
          value="0.9"
          oninput="updateMsgBoxColor()"
        />
        <input
          type="text"
          id="msgbox-color-input"
          readonly
          style="display: none"
        />
      </div>

      <!-- Color picker controls for chat text color configuration -->
      <div
        class="color-picker-wrapper"
        style="display: flex; gap: 10px; align-items: center"
      >
        <label for="textcolor-picker">Text Color:</label>
        <input
          type="color"
          id="textcolor-picker"
          value="#ffffff"
          oninput="updateTextColor()"
        />
        <input
          type="text"
          id="textcolor-input"
          readonly
          style="display: none"
        />
      </div>

      <div style="display: flex; gap: 4px; align-items: center; flex: 1">
        <input type="text" id="pinned-input" placeholder="Pinned Message" />
        <button
          type="button"
          id="clear-announcement-btn"
          style="background: #ff4757; padding: 6px 10px"
        >
          Clear Announce
        </button>
      </div>
      <!-- Emote Wall Configuration Toggles (Dynamically Generated) -->
      <div
        id="emote-toggles-container"
        style="
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
          align-items: center;
          width: 100%;
          border-top: 1px solid rgba(255, 105, 180, 0.3);
          padding-top: 8px;
          margin-top: 4px;
        "
      >
        <span
          style="font-size: 12px; font-weight: bold; color: var(--accent-pink)"
          >Emote Walls:</span
        >
        <!-- Checkboxes will be injected here automatically by JavaScript -->
      </div>

      <!-- Toggle button for scrolling (does not save) -->
      <button id="toggle-scroll-btn" type="button">Scrolling: ON</button>

      <!-- Button to initialize connections to chat platforms -->
      <button onclick="startChat()" id="connect-btn">Connect</button>

      <!-- Wrap your JS in script tags so the browser runs it -->
      <script>
        document
          .getElementById("connect-btn")
          .addEventListener("click", async () => {
            saveCurrentSettingsToCloud();
          });
      </script>
      <button id="clearColorsBtn">Clear Color Settings</button>
      <button id="clearEmotesBtn">Clear Emote Settings</button>
    </div>

    <div id="pinned-announcement-bar">
      <span id="announcement-text"></span>
    </div>

    <!-- Main dynamic chat message feed injection container -->
    <div id="chat-container"></div>

    <!-- External Script Files -->
    <script src="bannedWords.js"></script>
    <script src="common.js"></script>
    <script src="twitch.js"></script>
    <script src="kick.js"></script>
    <script src="youtube.js"></script>
  </body>
</html>
